<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>名古屋・三重 7日家族旅行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --ink:#6a3d2b; --ink-soft:#8a6a52; --gold:#c2904a; --gold-soft:#ecdcbb;
  --persimmon:#d2622f; --sea:#3f7d6e; --paper:#f8f3e9; --card:#fffdf8;
  --text:#4a3526; --muted:#a8977f; --line:#ebe0cd; --red:#c0392b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--text);
  font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(194,144,74,.05) 1px, transparent 1px);background-size:22px 22px;}
.app{max-width:520px;margin:0 auto;min-height:100%;background:var(--paper);position:relative;
  box-shadow:0 0 50px rgba(106,61,43,.06)}

/* ===== animations ===== */
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-1.5deg)}}
@keyframes floatB{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes pop{0%{transform:scale(.96) translateY(8px);opacity:.3}60%{transform:scale(1.015) translateY(0);opacity:1}100%{transform:scale(1)}}
@keyframes popIn{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes drift{0%{transform:translateX(0) translateY(0)}50%{transform:translateX(10px) translateY(-8px)}100%{transform:translateX(0) translateY(0)}}
.illo{animation:float 5.5s ease-in-out infinite;transform-origin:center bottom}
.illo.d2{animation-duration:6.5s}
.leaf-anim{animation:drift 7s ease-in-out infinite}
.day.pop{animation:pop .42s cubic-bezier(.34,1.56,.64,1)}
.daytab.on b{animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}

/* ===== masthead / home hero ===== */
header.top{background:linear-gradient(180deg,#fbf5ea 0%,var(--paper) 100%);padding:0 0 4px;
  padding-top:env(safe-area-inset-top);position:relative;overflow:hidden;text-align:center}
.hero{position:relative;height:186px;overflow:hidden}
.hero svg{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:430px;height:186px}
.herotext{padding:2px 20px 2px}
.eyebrow{font-size:11.5px;letter-spacing:.4em;color:var(--persimmon);font-weight:700;
  text-transform:uppercase;font-family:"Noto Serif TC",serif}
h1.title{font-family:"Noto Serif TC",serif;font-size:34px;font-weight:900;letter-spacing:.05em;
  margin:6px 0 0;line-height:1.1;color:#3a2a20}
.title2{font-family:"Noto Serif TC",serif;font-size:30px;font-weight:900;letter-spacing:.07em;
  margin:0;line-height:1.15;color:#3a2a20}
.title2 .r7{color:var(--red)}
.subline{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin-top:9px;
  font-size:12.5px;color:var(--ink-soft);font-weight:500}
.subline .mono{color:var(--text);font-weight:700;font-family:"Space Mono",monospace}

/* countdown */
.countdown{display:inline-flex;align-items:center;gap:9px;margin:12px auto 6px;
  background:#fff;border:1.5px solid var(--gold-soft);border-radius:999px;padding:7px 16px 7px 12px;
  box-shadow:0 3px 10px rgba(194,144,74,.14)}
.countdown .cdnum{font-family:"Space Mono",monospace;font-weight:700;font-size:26px;color:var(--persimmon);line-height:1}
.countdown .cdlbl{font-size:11px;color:var(--ink-soft);font-weight:700;text-align:left;line-height:1.25}
.countdown .cdlbl b{color:var(--text)}

/* ===== tabs ===== */
nav.tabs{display:flex;justify-content:flex-start;gap:3px;background:rgba(248,243,233,.95);
  backdrop-filter:blur(6px);padding:8px 10px 10px;position:sticky;top:0;z-index:500;overflow-x:auto;
  border-bottom:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex-shrink:0;border:none;background:none;padding:7px 14px;border-radius:999px;
  font-family:inherit;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;
  transition:background .2s,color .2s}
nav.tabs button.on{background:var(--ink);color:#fff;box-shadow:0 2px 8px rgba(106,61,43,.22)}

main{padding:16px 15px calc(40px + env(safe-area-inset-bottom))}
.view{display:none}
.view.on{display:block}

/* ===== card base ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;
  box-shadow:0 3px 14px rgba(106,61,43,.05)}

/* ===== home / overview ===== */
.sec-h{font-family:"Noto Serif TC",serif;font-size:13.5px;font-weight:900;color:#3a2a20;margin:13px 3px 7px;
  display:flex;align-items:center;gap:7px}
.sec-h:first-child{margin-top:2px}
.sec-h .bar{width:4px;height:14px;border-radius:3px;background:var(--persimmon)}
.daylist{display:flex;flex-direction:column;gap:7px}
.dayrow{display:flex;align-items:flex-start;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:10px 12px;cursor:pointer;box-shadow:0 2px 8px rgba(106,61,43,.05);transition:transform .12s}
.dayrow:active{transform:scale(.985)}
.dayrow .dc-badge{width:34px;height:34px;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:"Noto Serif TC",serif;font-weight:900;font-size:18px;flex-shrink:0;margin-top:1px}
.dayrow .drmid{flex:1;min-width:0}
.dayrow .drtop{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.dayrow .dc-date{font-family:"Space Mono",monospace;font-size:12px;font-weight:700;color:var(--ink-soft)}
.dayrow .dc-dow{font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.dayrow .dtemp{margin-left:auto;display:inline-flex;align-items:baseline;gap:4px;font-family:"Space Mono",monospace;font-weight:700;font-size:13px}
.dayrow .dtemp .hi{color:var(--persimmon)}
.dayrow .dtemp .lo{color:#2f7fd6}
.dayrow .dc-theme{font-family:"Noto Serif TC",serif;font-weight:700;font-size:14px;color:#3a2a20;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayrow .dc-spots{font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dayrow .drchev{color:var(--muted);font-size:17px;flex-shrink:0;align-self:center}
.wxrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:11px 13px;cursor:pointer;box-shadow:0 2px 8px rgba(106,61,43,.05);margin-top:7px}
.wxrow .wxi{font-size:19px}.wxrow .wxt{flex:1;font-family:"Noto Serif TC",serif;font-weight:700;font-size:14px;color:#3a2a20}
.wxrow .drchev{color:var(--muted);font-size:17px}
/* day nav (prev/next) */
.daynav{display:flex;gap:9px;margin-top:14px}
.daynav button{flex:1;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;
  font-weight:700;font-size:14px;padding:12px;border-radius:12px;cursor:pointer}
.daynav button:disabled{opacity:.35;cursor:default}
.daynav button:active:not(:disabled){background:var(--gold-soft)}

.infostrip{display:flex;gap:7px;flex-wrap:wrap}
.infochip{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px 10px;
  font-size:11px;color:var(--ink-soft);line-height:1.4;box-shadow:0 2px 6px rgba(106,61,43,.04)}
.infochip b{display:block;color:#3a2a20;font-size:12px;margin-bottom:1px}
.infochip .fs{font-family:"Space Mono",monospace;color:var(--muted);font-size:10px}

.budgetbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:10px 13px;box-shadow:0 2px 8px rgba(106,61,43,.05)}
.budgetbar .bt{font-family:"Space Mono",monospace;font-size:19px;font-weight:700;color:var(--ink);white-space:nowrap}
.budgetbar .bt small{font-size:11px;color:var(--muted);font-family:"Noto Sans TC";font-weight:700}
.psum{display:flex;flex-wrap:wrap;gap:4px 10px;flex:1;justify-content:flex-end}
.psum .pc{display:inline-flex;align-items:baseline;gap:4px;font-size:12px;font-weight:700}
.psum .pc .pv{font-family:"Space Mono",monospace;color:var(--text)}

/* ===== itinerary ===== */
.daytabs{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 14px;-webkit-overflow-scrolling:touch}
.daytabs::-webkit-scrollbar{display:none}
.daytab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
  border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:7px 13px;cursor:pointer;
  font-family:inherit;min-width:50px;transition:transform .12s}
.daytab:active{transform:scale(.94)}
.daytab b{font-family:"Noto Serif TC",serif;font-size:18px;font-weight:900;line-height:1.2;color:var(--dc)}
.daytab span{font-family:"Space Mono",monospace;font-size:10px;color:var(--muted)}
.daytab.on{background:var(--dc);border-color:var(--dc);box-shadow:0 3px 10px rgba(0,0,0,.15)}
.daytab.on b,.daytab.on span{color:#fff}

.dhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.daybadge{flex-shrink:0;width:56px;height:56px;border-radius:15px;color:#fff;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 9px rgba(20,30,50,.14)}
.daybadge b{font-family:"Noto Serif TC",serif;font-size:25px;font-weight:900;line-height:1}
.daybadge span{font-size:8.5px;letter-spacing:.18em;margin-top:2px;opacity:.92;font-weight:700}
.dmain{flex:1;min-width:0;padding-top:2px}
.drow{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.drow .ddate{font-family:"Space Mono",monospace;font-weight:700;font-size:15px;color:var(--ink-soft)}
.drow .ddow{font-size:11px;color:var(--ink-soft);border:1px solid var(--line);background:#fff;padding:1px 7px;border-radius:6px;font-weight:700}
.dtitle{font-family:"Noto Serif TC",serif;font-weight:900;font-size:21px;color:#3a2a20;line-height:1.25}
.dayillo{width:58px;height:58px;flex-shrink:0;margin-top:-2px}

.fixed{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;margin:0 0 8px;border-radius:11px;
  background:#f6efe2;border:1px solid var(--line)}
.fixed .fi{font-size:15px;flex-shrink:0}
.fixed .fx{font-size:13.5px;color:var(--ink-soft);font-weight:600;line-height:1.45}
.fixed .fx b{color:#3a2a20;font-weight:700}

.acts{padding:0}
.actcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--dc,var(--gold));
  border-radius:12px;padding:11px 13px;margin-bottom:9px;box-shadow:0 2px 7px rgba(106,61,43,.05)}
.actcard.food{background:#fdf6ea}
.actcard.night{background:#f4f1f8}
.acrow{display:flex;align-items:flex-start;gap:10px}
.actime{font-family:"Space Mono",monospace;font-size:12.5px;font-weight:700;color:var(--persimmon);
  min-width:46px;flex-shrink:0;padding-top:1px}
.actime.none{color:#cfc4b2}
.acname{flex:1;min-width:0;font-size:15px;font-weight:700;color:#3a2a20;line-height:1.4;word-break:break-word}
.acg{font-size:16px;text-decoration:none;flex-shrink:0;opacity:.85}
.achours{font-size:12px;color:var(--ink-soft);margin-top:6px;padding-left:56px;line-height:1.5}
/* ===== 跟團整天大卡片 ===== */
.tourcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--dc,var(--gold));
  border-radius:14px;padding:3px 14px 8px;margin-bottom:9px;box-shadow:0 3px 12px rgba(106,61,43,.08)}
.deptarea{font-size:12.5px;font-weight:800;color:#3a2a20;margin:12px 2px 6px}
.deptrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px dashed var(--line)}
.deptrow:first-child{border-top:0}
.deptmid{flex:1;min-width:0}
.deptn{font-size:13.5px;font-weight:700;color:var(--ink)}
.deptm{font-size:11px;color:var(--muted);margin-top:1px}
.depth{font-size:12px;font-weight:700;color:var(--sea);margin-top:2px}
.deptg{text-decoration:none;font-size:15px}
.howto{margin:8px 0 2px 51px;background:#f3f8f6;border:1px solid #cfe3dc;border-radius:10px;padding:0 10px}
.howto summary{font-size:12px;font-weight:800;color:var(--sea);padding:8px 0;cursor:pointer;list-style:none}
.howto summary::-webkit-details-marker{display:none}
.howto summary::after{content:" ▾"}
.howto[open] summary::after{content:" ▴"}
.howto ol{margin:0 0 10px;padding-left:20px}
.howto li{font-size:12.5px;line-height:1.6;color:var(--ink);margin-top:4px}
.sharedcard{background:#fffaf0;border:1px solid var(--line);border-left:4px solid var(--dc,var(--gold));border-radius:14px;padding:4px 12px 10px;margin-top:14px}
.sharedhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:11px 1px 10px;border-bottom:1.5px dashed var(--line);margin-bottom:8px}
.sh-name{font-family:"Noto Serif TC",serif;font-weight:900;font-size:14.5px;color:#3a2a20}
.sh-sub{font-size:11.5px;color:var(--muted)}
.tourhead{display:flex;align-items:center;gap:8px;padding:12px 1px 11px;border-bottom:1.5px dashed var(--line)}
.tourhead .th-ic{font-size:17px;flex-shrink:0}
.tourhead .th-name{flex:1;min-width:0;font-family:"Noto Serif TC",serif;font-weight:900;font-size:14.5px;
  color:var(--ink);line-height:1.35;word-break:break-word}
.tourhead .th-badge{flex-shrink:0;background:var(--dc,var(--gold));color:#fff;font-size:10.5px;font-weight:700;
  padding:3px 10px;border-radius:999px;letter-spacing:.5px}
.acts.tour .tactrow{padding:11px 1px 11px 2px;border-top:1px solid var(--line)}
.acts.tour .tactrow:first-child{border-top:none}
.splitlabel{font-size:11.5px;color:var(--muted);font-weight:700;margin:2px 2px 7px;letter-spacing:.5px}
.postacts{margin-top:2px}

/* night-view table */
.nighttbl{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(106,61,43,.05)}
.nighttbl .nt-h{background:#2a2438;color:#fff;font-family:"Noto Serif TC",serif;font-weight:900;font-size:14px;padding:10px 13px;display:flex;align-items:center;gap:7px}
.ntrow{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border-top:1px solid #f3eee3}
.ntrow .ntname{flex:1;min-width:0}
.ntrow .ntn{font-weight:700;font-size:13.5px;color:#3a2a20}
.ntrow .ntnote{font-size:11px;color:var(--muted);line-height:1.45;margin-top:2px}
.ntrow .nttime{font-family:"Space Mono",monospace;font-size:11.5px;font-weight:700;color:var(--sea);white-space:nowrap;text-align:right;flex-shrink:0}
.ntrow .ntg{text-decoration:none;font-size:14px;flex-shrink:0;opacity:.85}
.grp{margin-top:4px}
.grphead{font-family:"Noto Serif TC",serif;font-weight:900;font-size:14px;color:#3a2a20;margin:2px 0 6px;display:flex;align-items:baseline;gap:7px}
.grphead .gs{font-size:11px;color:var(--muted);font-weight:500;font-family:"Noto Sans TC"}
.grpdiv{height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px);margin:12px 0}
.grptabs{display:flex;gap:6px;background:var(--gold-soft);padding:4px;border-radius:999px;margin:2px 0 11px}
.grptab{flex:1;border:none;background:none;color:var(--ink-soft);font-family:inherit;font-size:13px;font-weight:700;padding:8px 6px;border-radius:999px;cursor:pointer;transition:background .15s}
.grptab.on{background:#fff;color:var(--ink);box-shadow:0 1px 5px rgba(106,61,43,.14)}
.sortbtn{border:1px solid var(--line);background:#fbf4e4;color:var(--ink-soft);font-family:inherit;
  font-weight:700;font-size:12px;padding:6px 12px;border-radius:9px;cursor:pointer;margin-top:4px}
.sortbtn:active{background:var(--gold-soft)}

/* ===== booked ===== */
.bksec{margin-bottom:20px}
.bkcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px;
  box-shadow:0 2px 8px rgba(106,61,43,.05)}
.bkcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.bkflight{font-family:"Space Mono",monospace;font-weight:700;font-size:15px;color:var(--persimmon)}
.bkdate{font-size:12px;color:var(--ink-soft);font-weight:700}
.bkroute{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bkpt{text-align:center}
.bkpt b{display:block;font-family:"Space Mono",monospace;font-size:20px;color:var(--text);line-height:1.1}
.bkpt span{font-size:11px;color:var(--muted)}
.bkline{flex:1;text-align:center;font-size:11px;color:var(--gold);border-top:1.5px dashed var(--line);padding-top:4px;margin-top:9px}
.bkhotel{font-family:"Noto Serif TC",serif;font-weight:900;font-size:16px;color:#3a2a20}
.bkhoteldates{font-size:12.5px;color:var(--ink-soft);font-weight:700;margin:3px 0 7px}
.bkmeta{font-size:12px;color:var(--muted);margin-top:8px}
.bkmeta b{color:var(--ink);font-family:"Space Mono",monospace}
.addr{display:flex;align-items:center;gap:8px;background:#f6efe2;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.addr .atxt{flex:1;min-width:0;font-size:12.5px;color:var(--text);line-height:1.45}
.addr .atxt .ano{font-family:"Space Mono",monospace;color:var(--ink-soft);font-size:11px}
.copybtn{flex-shrink:0;border:1.5px solid var(--gold);background:#fff;color:var(--ink);font-family:inherit;
  font-weight:700;font-size:11.5px;padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.copybtn:active{background:var(--gold-soft)}
.copybtn.done{background:var(--sea);color:#fff;border-color:var(--sea)}
.bktix{font-size:13px;color:var(--text);line-height:1.7}
.bktix b{color:#3a2a20}
.bktix .k{color:var(--muted);font-size:11.5px}

/* ===== budget ===== */
.conv{background:#fbf4e4;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:16px}
.conv .lbl{font-size:11px;color:var(--ink-soft);letter-spacing:.12em;font-weight:700}
.conv .row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.conv input{font-family:"Space Mono",monospace;font-size:16px;font-weight:700;border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;width:92px;text-align:right;background:#fff;color:var(--text)}
.conv .eq{font-size:14px;color:var(--muted)}
.conv .ntd{background:#fff;color:var(--ink)}
.conv .rate{font-size:11px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px}
.conv .rate input{width:60px;padding:3px 6px;font-size:12px;text-align:center}
.total{display:flex;align-items:baseline;justify-content:space-between;margin:2px 3px 12px}
.total .tl{font-size:12px;color:var(--muted);font-weight:700}
.total .tv{font-family:"Space Mono",monospace;font-size:22px;font-weight:700;color:var(--ink)}
.bars{margin:0 2px 14px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11.5px}
.bar .bn{width:42px;color:var(--ink-soft);font-weight:700;flex-shrink:0}
.bar .bt{flex:1;height:9px;background:#efe6d4;border-radius:5px;overflow:hidden}
.bar .bf{height:100%;border-radius:5px}
.bar .bv{width:56px;text-align:right;font-family:"Space Mono",monospace;color:var(--muted);flex-shrink:0}
.payers{margin:6px 3px 16px;padding:11px 12px;background:#fbf7ee;border:1px solid var(--line);border-radius:12px}
.payers .psumhead{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:9px}
.payers .pchips{display:flex;flex-wrap:wrap;gap:14px}
.payers .pchip{display:inline-flex;align-items:baseline;gap:5px;font-size:13px;font-weight:700}
.payers .pchip .pv{font-family:"Space Mono",monospace;color:var(--text)}
.exp{padding:10px 4px;border-bottom:1px solid #f1ece0}
.exp .r1{display:flex;align-items:flex-start;gap:8px}
.exp .r2{display:flex;align-items:center;gap:8px;margin-top:8px}
.exp select{border:none;border-radius:7px;font-family:inherit;font-size:11px;font-weight:700;padding:5px 6px;
  color:#fff;-webkit-appearance:none;appearance:none;text-align:center;width:62px;flex-shrink:0}
.exp .en{flex:1;min-width:0;border:none;background:none;font-family:inherit;font-size:14px;padding:3px 0;
  resize:none;overflow:hidden;line-height:1.4;color:var(--text)}
.exp .ea{width:88px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:"Space Mono",monospace;
  font-size:14px;text-align:right;background:#fff;color:var(--text)}
.exp .paylbl{font-size:11px;color:var(--muted);font-weight:700;margin-left:auto}
.exp select.who{background:#fff;color:var(--ink-soft);border:1px solid var(--line)}
.exp .del{border:none;background:none;color:#d2c7b6;font-size:16px;cursor:pointer;padding:0 2px;flex-shrink:0}

/* ===== food ===== */
.fmappills{display:flex;gap:6px;margin-bottom:10px}
.fmp{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:999px;padding:5px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.fmp.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#foodmap{height:280px;border-radius:16px;border:1px solid var(--line);overflow:hidden;margin-bottom:18px}
/* ===== weather ===== */
.wnote{font-size:12px;color:var(--ink-soft);background:#fbf4e4;border:1px solid var(--line);border-radius:12px;padding:11px 13px;line-height:1.6;margin-bottom:16px}
.todo{background:#fcefe2;border:1px solid #f0cba8;border-radius:12px;padding:11px 13px 5px;margin-bottom:16px}
.todo-h{font-family:"Noto Serif TC",serif;font-weight:900;font-size:14px;color:#b5531f;margin-bottom:4px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(106,61,43,.05)}
.wcard .wtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.wcard .wname{font-family:"Noto Serif TC",serif;font-weight:900;font-size:15px;color:#3a2a20}
.wcard .wtemp{font-family:"Space Mono",monospace;font-weight:700;font-size:15px}
.wcard .wtemp .hi{color:var(--persimmon)}
.wcard .wtemp .lo{color:#2f7fd6}
.wcard .wdesc{font-size:12px;color:var(--ink-soft);line-height:1.5}
.wcard .wtag{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;border-radius:6px;padding:2px 8px;margin-top:6px}
.wsec{font-family:"Noto Serif TC",serif;font-weight:900;font-size:15px;color:#3a2a20;margin:18px 3px 10px;display:flex;align-items:center;gap:7px}
.wsec .bar{width:4px;height:15px;border-radius:3px;background:var(--sea)}
.olist{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px;box-shadow:0 2px 8px rgba(106,61,43,.05)}
.orow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f3eee3;font-size:13px;line-height:1.5}
.orow:last-child{border-bottom:none}
.orow .oi{font-size:17px;flex-shrink:0;width:24px;text-align:center}
.orow b{color:#3a2a20}
.wlinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.wlink{flex:1;min-width:90px;text-align:center;background:var(--ink);color:#fff;text-decoration:none;border-radius:10px;padding:10px;font-size:12.5px;font-weight:700}
.fgroup{margin-bottom:18px}
.fglabel{font-family:"Noto Serif TC",serif;font-weight:900;font-size:15px;color:#3a2a20;margin:2px 2px 8px}
.fitem{display:block;padding:9px 3px;border-bottom:1px solid #f3eee3}
.fitem:last-child{border-bottom:none}
.fmain{display:flex;align-items:center;gap:8px}
.fhours{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;padding-left:30px;font-size:11.5px;color:var(--ink-soft)}
.fhours .hrtxt{font-weight:700;color:#3a2a20}
.fhours .rt-h{font-size:11px;color:var(--sea);font-weight:700;text-decoration:none;white-space:nowrap}
.fhours .rt-h:active{color:var(--persimmon)}
.flines{padding-left:30px;margin-top:5px}
.fline{display:flex;gap:8px;font-size:12.5px;line-height:1.5;padding:3px 0;border-top:1px dashed var(--line)}
.fline:first-child{border-top:0}
.fl-k{flex:0 0 82px;color:var(--muted);font-weight:700;white-space:nowrap}
.fl-v{flex:1;color:var(--ink-soft);min-width:0}
.fl-v.tb{color:var(--sea);font-weight:800}
.fl-v.gg{color:#c9701c;font-weight:800}
.fline.na .fl-v{color:#b9ad9f;font-weight:500}
.frate{display:flex;align-items:center;gap:10px;margin-top:5px;padding-left:30px}
.rt-tb{font-size:11px;font-weight:700;color:#fff;background:var(--sea);border-radius:6px;padding:3px 9px;text-decoration:none;display:inline-block}
.rt-g{font-size:11.5px;color:var(--ink-soft);font-weight:700;text-decoration:none}
.rt-g:active{color:var(--persimmon)}
.fcheck{width:22px;height:22px;border:2px solid var(--gold);border-radius:7px;flex-shrink:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--sea);font-weight:900;font-size:14px}
.fitem.done .fcheck{background:var(--sea);border-color:var(--sea);color:#fff}
.ftype{flex-shrink:0;width:56px;border:1px solid var(--line);border-radius:7px;background:#faf6ee;
  font-family:inherit;font-size:11.5px;color:var(--ink-soft);padding:5px 5px;text-align:center}
.ftype:focus{outline:none;border-color:var(--gold)}
.fname{flex:1;min-width:0;border:none;background:none;font-family:inherit;font-size:14.5px;color:var(--text);padding:3px 0}
.fitem.done .fname{color:var(--muted);text-decoration:line-through}
.fname:focus{outline:none}
.gmap{text-decoration:none;font-size:15px;flex-shrink:0;opacity:.85}
.fdel{border:none;background:none;color:#d2c7b6;font-size:16px;cursor:pointer;padding:0 2px;flex-shrink:0}

/* map */
#map{height:62vh;min-height:380px;border-radius:16px;border:1px solid var(--line);overflow:hidden;margin-top:4px}
.daypills{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px}
.daypills::-webkit-scrollbar{display:none}
.dp{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:999px;
  padding:5px 13px;font-size:12.5px;font-weight:700;cursor:pointer}
.dp.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* footer */
footer{padding:16px 16px 36px;text-align:center;color:var(--muted);font-size:11px}
.savedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sea);margin-right:6px;opacity:0;transition:opacity .3s;vertical-align:middle}
.savedot.show{opacity:1}
.bkrow{margin-top:10px}
.bklink{border:none;background:none;color:var(--ink-soft);font-family:inherit;font-size:12px;font-weight:700;text-decoration:underline;cursor:pointer}
.bkpanel{margin-top:10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.bkhint{font-size:11.5px;color:var(--muted);line-height:1.55;margin-bottom:8px}
.bktext{width:100%;height:84px;border:1px solid var(--line);border-radius:8px;padding:8px;
  font-family:"Space Mono",monospace;font-size:11px;color:var(--text);resize:vertical;box-sizing:border-box}
.bkbtns{display:flex;gap:8px;margin-top:8px}
.bkb{border:1px solid var(--line);background:#faf6ee;color:var(--ink-soft);font-family:inherit;font-weight:700;font-size:12.5px;padding:8px 12px;border-radius:8px;cursor:pointer}
.bkb.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.bkmsg{font-size:12px;color:var(--sea);margin-top:8px;font-weight:700;min-height:14px}
.empty{color:var(--muted);font-size:13px;padding:6px 4px}

/* ============================================================
   v32 redesign — 動畫 / 時間軸 / 小卡 / 天氣 / 已訂
   ============================================================ */
@keyframes leaffall{0%{transform:translateY(-24px) translateX(0) rotate(0);opacity:0}
  12%{opacity:.95}88%{opacity:.95}100%{transform:translateY(230px) translateX(26px) rotate(340deg);opacity:0}}
@keyframes cdGlow{0%,100%{box-shadow:0 8px 24px rgba(210,98,47,.2)}50%{box-shadow:0 13px 38px rgba(210,98,47,.44)}}
@keyframes cdPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes introUp{0%{transform:translateY(14px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes ballPop{0%{transform:scale(.5)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes twinkle{0%,100%{opacity:.5}50%{opacity:1}}
.herotext{animation:introUp .75s ease both}
.leaffall{position:absolute;top:-10px;pointer-events:none;z-index:4;will-change:transform;
  animation:leaffall linear infinite}

/* ---- countdown 大字無框 + 小動畫 ---- */
.countdown{display:inline-flex;align-items:center;gap:14px;margin:18px auto 14px;
  background:none;border:none;border-radius:0;padding:0;box-shadow:none;position:relative;overflow:visible;
  animation:cdFloat 3.6s ease-in-out infinite}
.countdown::before,.countdown::after{display:none}
@keyframes cdFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.countdown .cdnum{display:inline-block;font-family:"Space Mono",monospace;font-weight:700;font-size:64px;line-height:1.2;
  padding:0 2px;color:#d2622f;letter-spacing:-2px;animation:cdPop 3.6s ease-in-out infinite}
@keyframes cdPop{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.countdown .cdlbl{font-family:"Noto Serif TC",serif;font-size:15px;color:var(--ink-soft);font-weight:700;text-align:left;line-height:1.35}
.countdown .cdlbl b{display:block;color:var(--persimmon);font-size:20px;font-weight:900;margin-top:1px}
.countdown.live .cdnum{font-size:40px;letter-spacing:-1px}
.countdown.done .cdnum{font-size:32px;letter-spacing:0}

/* ---- overview: 今天高亮 ---- */
.dayrow{position:relative}
.dayrow.today{border-color:var(--persimmon);box-shadow:0 4px 16px rgba(210,98,47,.18)}
.todaytag{display:none;position:absolute;top:-8px;right:12px;background:var(--persimmon);color:#fff;
  font-size:9.5px;font-weight:700;padding:1px 9px;border-radius:999px;box-shadow:0 2px 6px rgba(210,98,47,.35)}
.dayrow.today .todaytag{display:inline-block}

/* ---- 行程：左側時間軸 + 跟隨球球 ---- */
.tlwrap{position:relative;padding-left:26px;margin-top:4px}
.tlwrap>.rail{position:absolute;left:9px;top:12px;bottom:12px;width:2px;border-radius:2px;
  background:var(--dc,var(--gold));opacity:.28}
.tlwrap>.ball{position:absolute;left:2px;top:12px;width:16px;height:16px;border-radius:50%;
  background:var(--dc,var(--gold));border:3px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.22);
  z-index:5;transition:top .25s cubic-bezier(.34,1.3,.5,1);animation:ballPop .4s ease}
.tldot{position:absolute;left:5px;width:10px;height:10px;border-radius:50%;background:#fff;
  border:2px solid var(--dc,var(--gold));opacity:.45;z-index:2;transition:opacity .2s}

/* ---- 行程小卡：低調 + 分行好讀 ---- */
.actcard{position:relative;background:#fffefb;border:1px solid var(--line);
  border-left:3px solid var(--dc,var(--gold));border-radius:11px;padding:10px 12px 11px;margin-bottom:8px;
  box-shadow:0 1px 4px rgba(106,61,43,.04);transition:transform .13s ease,box-shadow .22s ease,border-color .22s}
.actcard:active{transform:scale(.98)}
.actcard.food{background:#fdf7ec}
.actcard.night{background:#f5f2fa}
.actcard.tlon{box-shadow:0 5px 18px rgba(106,61,43,.13);border-color:var(--dc,var(--gold))}
.ac-top{display:flex;align-items:baseline;gap:9px}
.ac-time{font-family:"Space Mono",monospace;font-size:12px;font-weight:700;color:var(--dc,var(--persimmon));
  flex-shrink:0;min-width:42px;letter-spacing:-.5px}
.ac-time.none{color:#d8ccba}
.ac-name{flex:1;min-width:0;font-size:14.5px;font-weight:700;color:#3a2a20;line-height:1.5;word-break:break-word}
.ac-g{font-size:15px;text-decoration:none;flex-shrink:0;opacity:.8}
.ac-note{margin-top:6px;padding-left:51px}
.achline{font-size:12px;color:var(--ink-soft);line-height:1.55;position:relative;padding-left:12px;margin-top:3px}
.achline::before{content:"";position:absolute;left:2px;top:8px;width:4px;height:4px;border-radius:50%;
  background:var(--dc,var(--gold));opacity:.55}
.acts.tour .tactrow{position:relative;padding:11px 2px 11px 2px}
.tactrow .ac-note{padding-left:51px}

/* ---- 今日地圖 ---- */
.daymaph{font-family:"Noto Serif TC",serif;font-weight:900;font-size:14px;color:#3a2a20;margin:20px 3px 8px;
  display:flex;align-items:center;gap:7px}
.daymaph .bar{width:4px;height:14px;border-radius:3px;background:var(--dc,var(--sea))}
.daymap{height:230px;border-radius:14px;border:1px solid var(--line);overflow:hidden;box-shadow:0 2px 8px rgba(106,61,43,.05)}
.routebtn{margin-left:auto;background:var(--sea);color:#fff;font-size:11.5px;font-weight:700;text-decoration:none;
  padding:6px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(63,125,110,.3)}
.routebtn:active{opacity:.85}
.dayroute{display:block;text-align:center;background:var(--sea);color:#fff;font-weight:700;font-size:13.5px;
  text-decoration:none;padding:11px;border-radius:12px;margin:2px 0 10px;box-shadow:0 3px 10px rgba(63,125,110,.28)}
.dayroute:active{opacity:.88}

/* ---- 天氣：每日時段溫度 ---- */
.wday{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--wc,var(--sea));
  border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(106,61,43,.05)}
.wday .wd-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.wday .wd-name{font-family:"Noto Serif TC",serif;font-weight:900;font-size:15px;color:#3a2a20;flex:1}
.wday .wd-days{font-size:10.5px;color:var(--muted);font-family:"Space Mono",monospace}
.wslots{display:flex;gap:7px}
.wslot{flex:1;text-align:center;background:#faf5ec;border-radius:10px;padding:7px 4px}
.wslot .ws-l{font-size:10.5px;color:var(--muted);font-weight:700}
.wslot .ws-h{font-size:9px;color:#b9a98f;font-family:"Space Mono",monospace;margin-top:1px}
.wslot .ws-t{font-family:"Space Mono",monospace;font-size:18px;font-weight:700;margin-top:2px;line-height:1}
.wslot.am .ws-t{color:#2f7fd6}.wslot.noon .ws-t{color:var(--persimmon)}.wslot.pm .ws-t{color:#7a5ea8}
.wday .wd-desc{font-size:12px;color:var(--ink-soft);line-height:1.5;margin-top:9px}
.wtag2{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;border-radius:6px;padding:2px 9px;margin-top:8px;background:var(--wc,var(--sea))}
.wcopy{display:flex;align-items:center;gap:8px;background:#f6efe2;border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:7px}
.wcopy .wct{flex:1;min-width:0}
.wcopy .wcn{font-size:12.5px;font-weight:700;color:#3a2a20}
.wcopy .wcq{font-size:11px;color:var(--ink-soft);font-family:"Space Mono",monospace;margin-top:1px;word-break:break-all}
.maple{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f3eee3;font-size:12.5px;line-height:1.55}
.maple:last-child{border-bottom:none}
.maple .mp-ic{font-size:16px;flex-shrink:0;width:22px;text-align:center}
.maple b{color:#3a2a20}
.mp-hi{color:#c0392b;font-weight:700}.mp-mid{color:#e08a1e;font-weight:700}.mp-lo{color:var(--muted);font-weight:700}
.ofit{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f3eee3;font-size:12.5px;line-height:1.55;align-items:flex-start}
.ofit:last-child{border-bottom:none}
.ofit .of-d{flex-shrink:0;width:30px;height:30px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif TC",serif;font-weight:900;font-size:14px;margin-top:1px}
.ofit b{color:#3a2a20}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin:0 1px;border:1px solid rgba(0,0,0,.1)}

/* ---- 已訂：大項目快速跳 ---- */
.bkjump{display:flex;gap:7px;margin-bottom:14px}
.bkjump button{flex:1;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;
  font-weight:700;font-size:12.5px;padding:9px 4px;border-radius:11px;cursor:pointer;transition:background .15s}
.bkjump button:active{background:var(--gold-soft)}
.bksec,.sec-h{scroll-margin-top:86px}

/* ---- 行前：已完成標記 ---- */
.donestrip{display:flex;gap:7px;margin:2px 0 6px}
.donechip{flex:1;background:#edf7ee;border:1px solid #cfe6cf;border-radius:12px;padding:9px 6px;text-align:center;
  font-size:11px;font-weight:700;color:#2e7d32;line-height:1.4}
.donechip b{display:block;font-size:13px;color:#1f5e23}
.badge-done{display:inline-block;background:#2e9e4f;color:#fff;font-size:10.5px;font-weight:700;padding:1px 9px;border-radius:999px;margin-left:7px;vertical-align:middle}

/* ============ v33：子導覽固定 / 出門起床 / 飯店 / 天氣合併 ============ */
/* 子導覽 sticky（跟主導覽一起固定在上面） */
nav.tabs{z-index:600}
.daytabs,.bkjump{position:sticky;top:45px;z-index:420;background:var(--paper);
  margin-left:-15px;margin-right:-15px;padding-left:15px;padding-right:15px;
  box-shadow:0 7px 10px -9px rgba(106,61,43,.3)}
.daytabs{padding-top:8px;padding-bottom:10px}
.bkjump{padding-top:8px;padding-bottom:10px}
.grptabs{position:sticky;top:112px;z-index:410}

/* 起床・出門 */
.daybrief{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 9px}
.dbchip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:7px 12px;font-size:12.5px;font-weight:700;color:var(--ink-soft);
  box-shadow:0 1px 4px rgba(106,61,43,.04)}
.dbchip .k{color:var(--muted);font-size:11px;font-weight:700}
.dbchip b{color:var(--persimmon);font-family:"Space Mono",monospace;font-size:13.5px}
.leavenote{font-size:12px;color:var(--ink-soft);line-height:1.5;background:#fbf4e4;border:1px solid var(--line);
  border-radius:10px;padding:8px 11px;margin:0 0 10px}

/* 早晚飯店地標 */
.hotelbar{display:flex;align-items:center;gap:9px;background:#f3ede0;border:1px dashed #d9c9a6;
  border-radius:11px;padding:9px 12px;margin:2px 0 10px}
.hotelbar .hb-ic{font-size:16px;flex-shrink:0}
.hotelbar .hb-t{flex:1;min-width:0;font-size:13px;font-weight:700;color:#3a2a20}
.hotelbar .hb-t span{display:inline-block;background:var(--gold);color:#fff;font-size:10px;font-weight:700;
  padding:1px 7px;border-radius:999px;margin-right:6px;vertical-align:1px}
.hotelbar .hb-g{text-decoration:none;font-size:17px;flex-shrink:0;opacity:.9}

/* 夜景：兩個地標 */
.ntgs{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.ntg2{text-decoration:none;font-size:11px;font-weight:700;color:var(--sea);background:#eef5f2;
  border:1px solid #d5e6df;border-radius:8px;padding:4px 8px;white-space:nowrap}
.ntg2:active{background:var(--sea);color:#fff}

/* 已訂飯店：地圖按鈕 */
.addrbtns{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.copybtn.mapbtn{text-decoration:none;text-align:center;border-color:var(--sea);color:var(--sea)}
.copybtn.mapbtn:active{background:var(--sea);color:#fff}

/* 天氣合併卡新增 */
.wwhen{font-size:12px;color:var(--ink-soft);background:#fbf4e4;border:1px solid var(--line);border-radius:9px;

/* ============ storage ============ */
var KEY="nagoyatoba_v3";
var mem=JSON.parse(JSON.stringify(DEFAULT_DATA));
var hasStore=(typeof window.storage!=="undefined" && window.storage);
var hasLS=(function(){try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true;}catch(e){return false;}})();
async function loadStore(){
  var loaded=false;
  if(hasLS){try{var raw=localStorage.getItem(KEY);if(raw){mem=JSON.parse(raw);loaded=true;}}catch(e){}}
  else if(hasStore){try{var r=await window.storage.get(KEY,false);if(r&&r.value){mem=JSON.parse(r.value);loaded=true;}}catch(e){}}
  if(!loaded){mem=JSON.parse(JSON.stringify(DEFAULT_DATA));}
  var upgraded=false;
  if((mem.dataVersion||0) < (DEFAULT_DATA.dataVersion||0)){
    var keepShop=Array.isArray(mem.shop)?mem.shop:null; // 保留使用者的購物清單
    mem=JSON.parse(JSON.stringify(DEFAULT_DATA));
    if(keepShop){
      // 合併:保留使用者既有項目,把新的預設項目(依名稱)補進來
      var exist=keepShop.map(function(s){return s.name;});
      (DEFAULT_DATA.shop||[]).forEach(function(s){ if(exist.indexOf(s.name)<0) keepShop.push(JSON.parse(JSON.stringify(s))); });
      mem.shop=keepShop;
    }
    upgraded=true;
  }
  if(!mem.activities)mem.activities={};
  if(!mem.budget)mem.budget=[];
  if(!mem.foods)mem.foods=[];
  if(!Array.isArray(mem.shop))mem.shop=JSON.parse(JSON.stringify(DEFAULT_DATA.shop||[]));
  if(typeof mem.rate!=="number")mem.rate=0.215;
  if(typeof mem.activeDay!=="number")mem.activeDay=0;
  mem.dataVersion=DEFAULT_DATA.dataVersion||0;
  if(upgraded && (hasLS||hasStore)){ try{ if(hasLS){localStorage.setItem(KEY,JSON.stringify(mem));} else {window.storage.set(KEY,JSON.stringify(mem),false);} }catch(e){} }
}
var saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{ if(hasLS){localStorage.setItem(KEY,JSON.stringify(mem));} else if(hasStore){window.storage.set(KEY,JSON.stringify(mem),false);} }catch(e){}
    var d=document.getElementById("savedot"); if(d){d.classList.add("show");setTimeout(function(){d.classList.remove("show");},700);}

}
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function gmap(q){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);}
/* 把行程文字清成乾淨的地點名(去掉 emoji / 箭頭 / 括號備註),按地圖才不會帶多餘字 */
function cleanPlace(n){
  n=(n||"").trim();
  if(/→/.test(n)){var pp=n.split("→");n=pp[pp.length-1];}      // 交通取目的地
  n=n.replace(/^[^一-鿿A-Za-z0-9ぁ-んァ-ヶー一-龠]+/,""); // 去開頭 emoji/符號
  n=n.split(/[（(·｜|／/,、]/)[0];                               // 到第一個分隔就停
  n=n.replace(/^(午餐|晚餐|早餐|選項|備案|備選)[:：]?/,"");       // 去餐別前綴
  return n.trim();
}
function mapHref(name,lat,lng){
  if(typeof lat==="number"&&typeof lng==="number")
    return "https://www.google.com/maps/search/?api=1&query="+lat+","+lng;
  return gmap(cleanPlace(name));
}
/* 把一串點串成 Google 地圖路線(最多取前10點) */
function routeUrl(pts,mode){
  pts=pts.filter(function(p){return typeof p.lat==="number"&&typeof p.lng==="number";}).slice(0,10);
  if(!pts.length)return "";
  if(pts.length===1)return "https://www.google.com/maps/search/?api=1&query="+pts[0].lat+","+pts[0].lng;
  var o=pts[0],d=pts[pts.length-1];
  var mid=pts.slice(1,-1).map(function(p){return p.lat+","+p.lng;}).join("|");
  var u="https://www.google.com/maps/dir/?api=1&origin="+o.lat+","+o.lng+"&destination="+d.lat+","+d.lng;
  if(mid)u+="&waypoints="+encodeURIComponent(mid);
  u+="&travelmode="+(mode||"transit");
  return u;
}
function hhmmMinus(t,mins){
  var m=/^(\d{1,2}):(\d{2})$/.exec((t||"").trim()); if(!m)return "";
  var tot=(+m[1])*60+(+m[2])-mins; while(tot<0)tot+=1440;
  var h=Math.floor(tot/60)%24, mi=tot%60;
  return (h<10?"0":"")+h+":"+(mi<10?"0":"")+mi;
}

/* ============ countdown ============ */
var TODAYIDX=-1;
function countdown(){
  var dep=new Date(2026,10,15,14,55,0), now=new Date();
  var start=new Date(2026,10,15,0,0,0), end=new Date(2026,10,21,23,59,59);
  var el=document.getElementById("cdnum"), lb=document.getElementById("cdlbl");
  var box=document.querySelector(".countdown");
  if(!el)return;
  TODAYIDX=-1;
  if(box){box.classList.remove("live","done");}
  if(now<dep){
    var d=Math.ceil((dep-now)/86400000);
    el.textContent=d;lb.innerHTML='天後<br><b>出發</b>';
  }else if(now<=end){
    var di=Math.floor((now-start)/86400000); if(di<0)di=0; if(di>6)di=6;
    TODAYIDX=di;
    el.textContent="Day "+(di+1);
    var th=(DAYS[di]&&DAYS[di].theme)?DAYS[di].theme:"";
    lb.innerHTML='旅程進行中<br><b>'+th+'</b>';
    if(box)box.classList.add("live");
  }else{
    el.textContent="已完成";lb.innerHTML='<b>辛苦了・回味中 🍁</b>';
    if(box)box.classList.add("done");
  }
}

  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;

  for(var i=0;i<7;i++){

    s.textContent=glyphs[i%glyphs.length];
    s.style.left=(6+i*13)+"%";

    s.style.animationDelay=(-i*1.3)+"s";
    s.style.opacity=".85";
    host.appendChild(s);
  }
}

function daySpots(d){
  var keys=d.groups?d.groups.map(function(g){return g.key;}):[d.date];
  var out=[];
  keys.forEach(function(k){
    (mem.activities[k]||[]).forEach(function(a){
      var raw=(a.n||"").trim();
      if(/^(🍴|🌃)/.test(raw))return; // skip food & night-view picks
      var n=raw.replace(/^[^一-鿿A-Za-z0-9]+/,"").trim();
      if(!n)return;
      if(/集合|回程|出發|公車站|車站|機場|出境|入境|退房|入住|午餐|晚餐|早餐|備案|提領|Check|→/i.test(n))return;
      // trim parenthetical notes for compactness
      n=n.replace(/[（(].*$/,"").trim();
      if(n)out.push(n);
    });
  });
  if(!out.length)return '<span style="color:var(--muted)">自由活動</span>';
  return out.join("・");
}

function attachSwipe(host){
  var x0=null,y0=null,t0=0;
  host.addEventListener("touchstart",function(e){var t=e.changedTouches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();},{passive:true});
  host.addEventListener("touchend",function(e){
    if(x0==null)return;var t=e.changedTouches[0];
    var dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.6 && Date.now()-t0<700){
      // don't hijack swipes that start on the day-tab strip (horizontal scroll)
      if(!(e.target.closest && e.target.closest(".daytabs"))) gotoDay(dx<0?1:-1);
    }
    x0=null;
  },{passive:true});
}
/* 時間軸：球球跟著捲動停在最接近畫面中央的卡片 */
var _tlHandler=null;
function buildTimeline(day){
  if(_tlHandler){window.removeEventListener("scroll",_tlHandler);window.removeEventListener("resize",_tlHandler);_tlHandler=null;}
  var wrap=day.querySelector(".tlwrap"); if(!wrap)return;
  var cards=[].slice.call(wrap.querySelectorAll(".actcard,.tactrow"));
  var ball=wrap.querySelector(".ball");
  if(!cards.length){if(ball)ball.style.display="none";var r0=wrap.querySelector(".rail");if(r0)r0.style.display="none";return;}
  cards.forEach(function(c){
    var dot=document.createElement("span"); dot.className="tldot";
    wrap.appendChild(dot); c._dot=dot;
  });
  function layout(){cards.forEach(function(c){c._dot.style.top=(c.offsetTop+15)+"px";});}
  function update(){
    var mid=window.innerHeight*0.4, best=null, bd=1e9;
    cards.forEach(function(c){
      var r=c.getBoundingClientRect(); var cy=r.top+r.height/2;
      var dist=Math.abs(cy-mid);
      if(dist<bd){bd=dist;best=c;}
      c.classList.remove("tlon");
    });
    if(best){best.classList.add("tlon"); if(ball)ball.style.top=(best.offsetTop+15-8)+"px"; best._dot.style.opacity="0";}
    cards.forEach(function(c){if(c!==best)c._dot.style.opacity="";});
  }
  function onScroll(){layout();update();}
  _tlHandler=onScroll;
  window.addEventListener("scroll",_tlHandler,{passive:true});
  window.addEventListener("resize",_tlHandler);
  setTimeout(onScroll,30); setTimeout(onScroll,260);
}

function parseTime(t){t=(t||"").trim();if(!t)return 1e9;t=t.replace(/[：．]/g,":");var m=t.match(/^(\d{1,2}):?(\d{2})?$/);if(!m)return 1e9;var h=+m[1],mi=m[2]?+m[2]:0;if(t.indexOf(":")<0&&t.length>=3){h=+t.slice(0,t.length-2);mi=+t.slice(-2);}return h*60+mi;}

/* ============ tabs ============ */
function switchTab(t){
  document.querySelectorAll("nav.tabs button").forEach(function(x){x.classList.toggle("on",x.getAttribute("data-tab")===t);});
  document.querySelectorAll(".view").forEach(function(x){x.classList.remove("on");});
  document.getElementById("view-"+t).classList.add("on");
  if(t==="home")renderHome();
  if(t==="trip")renderTrip();
  if(t==="booked")renderBooked();
  if(t==="shop")renderShop();
  if(t==="budget")document.querySelectorAll("#explist .en").forEach(function(ta){ta.style.height="auto";ta.style.height=ta.scrollHeight+"px";});
  if(t==="food")renderFood();
  if(t==="weather")renderWeather();
  if(t==="tax")renderTax();
  window.scrollTo(0,0);
}
function setupTabs(){document.querySelectorAll("nav.tabs button").forEach(function(b){b.addEventListener("click",function(){switchTab(b.getAttribute("data-tab"));});});}
function renderAll(){renderHome();renderTrip();renderBudget();renderFood();renderBooked();}
